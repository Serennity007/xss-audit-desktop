<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="XSS Audit Studio：浏览器本地代码安全审查，查看数据流证据、人工复核与离线报告。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>XSS Audit Studio｜代码安全审查工作台</title>
  <link rel="stylesheet" href="style.css?v=0.3.0"><script type="module" src="app.js?v=0.3.0"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">&lt;/&gt;</span><span>XSS <strong>AUDIT STUDIO</strong><small data-i18n="title"></small></span></a>
  <div class="top-right"><span class="local"><i></i><span data-i18n="local"></span></span><select id="language" aria-label="Language / 语言"><option value="zh">简体中文</option><option value="en">English</option></select></div>
</header>
<main>
  <section class="intro"><div><p class="eyebrow">SOURCE → EVIDENCE → REVIEW <span class="version" data-i18n="version"></span></p><h1 data-i18n="tagline"></h1><p class="subtle" data-i18n="private"></p></div><div class="actions"><select id="sample-kind"><option value="standard" data-i18n="standardSample"></option><option value="components" data-i18n="componentSample"></option></select><button id="sample" class="secondary" data-i18n="sample"></button><button id="import" class="secondary" data-i18n="import"></button><button id="folder" class="secondary" data-i18n="folder"></button><button id="analyze" class="primary" data-i18n="analyze"></button><button id="cancel" hidden data-i18n="cancel"></button></div></section>
  <input id="upload" type="file" multiple accept=".js,.jsx,.ts,.tsx,.mjs,.cjs,.vue,.svelte,.html,.htm" hidden>
  <input id="folder-upload" type="file" multiple webkitdirectory hidden>
  <input id="baseline-upload" type="file" accept=".json,application/json" hidden>
  <section id="metrics" class="metrics" aria-label="Analysis overview"><div><span data-i18n="scanned"></span><strong id="metric-files">—</strong></div><div><span data-i18n="counts"></span><strong id="metric-count">—</strong></div><div><span data-i18n="high"></span><strong id="metric-high">—</strong></div><div><span data-i18n="reviewed"></span><strong id="metric-reviewed">—</strong></div><div class="status-box"><span class="status-dot"></span><span id="status" role="status" aria-live="polite"></span></div></section>
  <details class="scope settings panel"><summary data-i18n="scopeSettings"></summary><p data-i18n="scopeHelp"></p><div class="scope-fields"><label><span data-i18n="include"></span><textarea id="include" rows="3" maxlength="5000" spellcheck="false"></textarea></label><label><span data-i18n="exclude"></span><textarea id="exclude" rows="3" maxlength="5000" spellcheck="false"></textarea></label></div><details id="inventory" hidden><summary><span data-i18n="importInventory"></span> · <span id="inventory-count">0</span></summary><ul id="inventory-list"></ul></details></details>
  <details class="scope settings panel project-tools"><summary data-i18n="projectTools"></summary><p data-i18n="projectHelp"></p><div class="project-actions"><button id="zip-import" class="secondary" data-i18n="zipImport"></button><label class="inline-check"><input type="checkbox" id="strip-root" checked><span data-i18n="stripRoot"></span></label><button id="save-project" class="secondary" data-i18n="saveProject"></button><button id="load-project" class="secondary" data-i18n="loadProject"></button></div><p class="coverage-warning" data-i18n="snapshotPrivacy"></p><input id="zip-upload" type="file" accept=".zip,application/zip" hidden><input id="project-upload" type="file" accept=".json,application/json" hidden></details>
  <details class="scope settings panel"><summary data-i18n="sourceSearch"></summary><div class="source-search-controls"><input id="source-query" type="search" maxlength="200" data-placeholder="sourceSearchHint"><label class="inline-check"><input id="source-case" type="checkbox"><span data-i18n="caseSensitive"></span></label><span id="source-count" role="status" aria-live="polite"></span></div><p class="subtle" data-i18n="sourceSearchHelp"></p><div id="source-matches" class="source-matches"></div></details>
  <section class="workbench">
    <aside class="files-panel panel"><div class="panel-heading"><h2 data-i18n="files"></h2><span class="counter" id="file-count">01</span></div><div id="file-list" class="file-list"></div><div class="file-actions"><button id="add" class="quiet" data-i18n="add"></button><button id="remove" class="quiet" data-i18n="remove"></button></div><p class="side-note" data-i18n="encoding"></p><div class="side-bottom"><span class="pill">JS / TS · HTML / Vue / Svelte</span><p data-i18n="editHint"></p><button id="reset" class="quiet" data-i18n="reset"></button></div></aside>
    <section class="editor-panel panel"><div class="panel-heading"><h2 data-i18n="editor"></h2><span class="pill" id="file-type">TS</span></div><label class="filename"><span data-i18n="selected"></span><input id="filename" value="review.ts" spellcheck="false" aria-label="Filename"></label><div class="editor-wrap"><pre id="gutter" aria-hidden="true">1</pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Source code" data-placeholder="empty"></textarea></div><div class="editor-footer"><span id="cursor">L1</span><span>UTF-8</span><span data-i18n="notice"></span></div></section>
    <section class="results-panel panel"><div class="panel-heading"><h2 data-i18n="results"></h2><span class="counter" id="result-count">—</span></div><div class="filters"><input id="search" type="search" data-placeholder="search" aria-label="Search findings"><select id="priority"><option value="" data-i18n="all"></option><option value="high" data-i18n="high"></option><option value="medium" data-i18n="medium"></option><option value="info" data-i18n="info"></option></select><select id="status-filter"><option value="" data-i18n="allStatuses"></option><option value="pending" data-i18n="pending"></option><option value="confirmed" data-i18n="confirmed"></option><option value="false_positive" data-i18n="false_positive"></option><option value="fixed" data-i18n="fixed"></option></select><select id="category"><option value="" data-i18n="allCategories"></option><option value="html" data-i18n="html"></option><option value="url" data-i18n="url"></option><option value="code" data-i18n="code"></option><option value="sanitizer" data-i18n="sanitizer"></option><option value="message" data-i18n="message"></option></select><select id="mode"><option value="" data-i18n="allModes"></option><option value="ast" data-i18n="ast"></option><option value="pattern" data-i18n="pattern"></option></select><select id="change-filter" disabled><option value="" data-i18n="allChanges"></option><option value="new" data-i18n="new"></option><option value="unchanged" data-i18n="unchanged"></option></select><label class="inline-check"><input id="file-only" type="checkbox"><span data-i18n="fileOnly"></span></label><button id="reset-filters" class="quiet" data-i18n="resetFilters"></button></div><div class="batch-controls"><span><span data-i18n="batchScope"></span> · <strong id="batch-count">0</strong></span><select id="batch-status"><option value="pending" data-i18n="pending"></option><option value="confirmed" data-i18n="confirmed"></option><option value="false_positive" data-i18n="false_positive"></option><option value="fixed" data-i18n="fixed"></option></select><button id="batch-apply" class="quiet" disabled data-i18n="batchApply"></button></div><div id="findings" class="findings"></div></section>
  </section>
  <section class="lower-grid"><section class="detail-panel panel"><div class="panel-heading"><h2 data-i18n="details"></h2><button id="copy" class="quiet" disabled data-i18n="copy"></button></div><div id="detail-content" class="detail-content"></div><div id="review-form" hidden><div class="review-fields"><label><span data-i18n="status"></span><select id="review-status"><option value="pending" data-i18n="pending"></option><option value="confirmed" data-i18n="confirmed"></option><option value="false_positive" data-i18n="false_positive"></option><option value="fixed" data-i18n="fixed"></option></select></label><label class="note-label"><span data-i18n="notes"></span><textarea id="review-note" maxlength="2000" rows="2"></textarea></label><button id="save" class="secondary" data-i18n="save"></button></div><p class="subtle" data-i18n="sourceNotStored"></p></div></section><section class="export-panel panel"><div class="panel-heading"><h2 data-i18n="export"></h2><span aria-hidden="true">↗</span></div><p data-i18n="reportScope"></p><div class="export-buttons"><button data-format="json" disabled>JSON <span>↓</span></button><button data-format="markdown" disabled>Markdown <span>↓</span></button><button data-format="html" disabled>HTML <span>↓</span></button><button data-format="sarif" disabled>SARIF <span>↓</span></button><button data-format="csv" disabled>CSV <span>↓</span></button><button id="copy-all" disabled data-i18n="copyAll"></button></div><p class="subtle" data-i18n="warning"></p></section></section>
  <section class="comparison-panel panel"><div class="panel-heading"><h2 data-i18n="baseline"></h2><div class="comparison-actions"><button id="use-baseline" class="quiet" disabled data-i18n="useBaseline"></button><button id="load-baseline" class="quiet" data-i18n="loadBaseline"></button><button id="clear-baseline" class="quiet" disabled data-i18n="clearBaseline"></button></div></div><div id="baseline-summary"></div><p class="subtle" data-i18n="baselineNotice"></p><details><summary data-i18n="notObserved"></summary><ul id="missing-list"></ul></details></section>
  <details class="scope panel" open><summary data-i18n="scope"></summary><p data-i18n="boundary"></p><p class="subtle" data-i18n="limits"></p><ul id="coverage"></ul></details>
</main>
<footer><div><strong>XSS AUDIT STUDIO</strong><p data-i18n="attribution"></p></div><div class="footer-actions"><a href="LICENSE.txt" target="_blank" rel="noopener" data-i18n="license"></a><a href="NOTICE.txt" target="_blank" rel="noopener">NOTICE</a><a href="THIRD-PARTY-NOTICES.txt" target="_blank" rel="noopener">Babel / parse5 / fflate · MIT</a><button id="clear" class="quiet" data-i18n="clear"></button></div></footer>
<dialog id="copy-dialog"><p data-i18n="copyFailed"></p><textarea id="copy-fallback" rows="10" readonly></textarea><button id="close-dialog" data-i18n="close"></button></dialog>
</body></html>
