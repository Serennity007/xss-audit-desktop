<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="XSS Audit Studio：浏览器本地代码安全审查，查看数据流证据、人工复核与离线报告。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>XSS Audit Studio｜代码安全审查工作台</title>
  <link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><span class="brand-mark" aria-hidden="true">&lt;/&gt;</span><span>XSS <strong>AUDIT STUDIO</strong><small data-i18n="title"></small></span></a>
  <div class="top-right"><span class="local"><i></i><span data-i18n="local"></span></span><select id="language" aria-label="Language / 语言"><option value="zh">简体中文</option><option value="en">English</option></select></div>
</header>
<main>
  <section class="intro"><div><p class="eyebrow">SOURCE → EVIDENCE → REVIEW</p><h1 data-i18n="tagline"></h1><p class="subtle" data-i18n="private"></p></div><div class="actions"><button id="sample" class="secondary" data-i18n="sample"></button><button id="import" class="secondary" data-i18n="import"></button><button id="analyze" class="primary" data-i18n="analyze"></button><button id="cancel" hidden data-i18n="cancel"></button></div></section>
  <input id="upload" type="file" multiple accept=".js,.jsx,.ts,.tsx,.mjs,.cjs" hidden>
  <section class="metrics" aria-label="Analysis overview"><div><span data-i18n="scanned"></span><strong id="metric-files">—</strong></div><div><span data-i18n="counts"></span><strong id="metric-count">—</strong></div><div><span data-i18n="high"></span><strong id="metric-high">—</strong></div><div><span data-i18n="reviewed"></span><strong id="metric-reviewed">—</strong></div><div class="status-box"><span class="status-dot"></span><span id="status" role="status" aria-live="polite"></span></div></section>
  <section class="workbench">
    <aside class="files-panel panel"><div class="panel-heading"><h2 data-i18n="files"></h2><span class="counter" id="file-count">01</span></div><div id="file-list" class="file-list"></div><div class="file-actions"><button id="add" class="quiet" data-i18n="add"></button><button id="remove" class="quiet" data-i18n="remove"></button></div><p class="side-note" data-i18n="encoding"></p><div class="side-bottom"><span class="pill">JS / TS / JSX / TSX</span><p data-i18n="editHint"></p><button id="reset" class="quiet" data-i18n="reset"></button></div></aside>
    <section class="editor-panel panel"><div class="panel-heading"><h2 data-i18n="editor"></h2><span class="pill" id="file-type">TS</span></div><label class="filename"><span data-i18n="selected"></span><input id="filename" value="review.ts" spellcheck="false" aria-label="Filename"></label><div class="editor-wrap"><pre id="gutter" aria-hidden="true">1</pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Source code" data-placeholder="empty"></textarea></div><div class="editor-footer"><span id="cursor">L1</span><span>UTF-8</span><span data-i18n="notice"></span></div></section>
    <section class="results-panel panel"><div class="panel-heading"><h2 data-i18n="results"></h2><span class="counter" id="result-count">—</span></div><div class="filters"><input id="search" type="search" data-placeholder="search" aria-label="Search findings"><select id="priority" aria-label="Review priority"><option value="" data-i18n="all"></option><option value="high" data-i18n="high"></option><option value="medium" data-i18n="medium"></option><option value="info" data-i18n="info"></option></select></div><div id="findings" class="findings"></div></section>
  </section>
  <section class="lower-grid"><section class="detail-panel panel"><div class="panel-heading"><h2 data-i18n="details"></h2><button id="copy" class="quiet" disabled data-i18n="copy"></button></div><div id="detail-content" class="detail-content"></div><div id="review-form" hidden><div class="review-fields"><label><span data-i18n="status"></span><select id="review-status"><option value="pending" data-i18n="pending"></option><option value="confirmed" data-i18n="confirmed"></option><option value="false_positive" data-i18n="false_positive"></option><option value="fixed" data-i18n="fixed"></option></select></label><label class="note-label"><span data-i18n="notes"></span><textarea id="review-note" maxlength="2000" rows="2"></textarea></label><button id="save" class="secondary" data-i18n="save"></button></div><p class="subtle" data-i18n="sourceNotStored"></p></div></section><section class="export-panel panel"><div class="panel-heading"><h2 data-i18n="export"></h2><span aria-hidden="true">↗</span></div><p data-i18n="reportScope"></p><div class="export-buttons"><button data-format="json" disabled>JSON <span>↓</span></button><button data-format="markdown" disabled>Markdown <span>↓</span></button><button data-format="html" disabled>HTML <span>↓</span></button></div><p class="subtle" data-i18n="warning"></p></section></section>
  <details class="scope panel" open><summary data-i18n="scope"></summary><p data-i18n="boundary"></p><p class="subtle" data-i18n="limits"></p><ul id="coverage"></ul></details>
</main>
<footer><div><strong>XSS AUDIT STUDIO</strong><p data-i18n="attribution"></p></div><div class="footer-actions"><a href="LICENSE.txt" target="_blank" rel="noopener" data-i18n="license"></a><a href="NOTICE.txt" target="_blank" rel="noopener">NOTICE</a><a href="THIRD-PARTY-NOTICES.txt" target="_blank" rel="noopener">Babel · MIT</a><button id="clear" class="quiet" data-i18n="clear"></button></div></footer>
<dialog id="copy-dialog"><p data-i18n="copyFailed"></p><textarea id="copy-fallback" rows="10" readonly></textarea><button id="close-dialog" data-i18n="close"></button></dialog>
</body></html>
