[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xss-audit-desktop"
version = "0.3.0"
description = "Local XSS review assistant with desktop, CLI, and opt-in AI review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Serennity007"}]
dependencies = ["tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2"]

[project.scripts]
xss-audit = "xss_audit.cli:main"
xss-audit-research = "xss_audit.research_cli:main"

[project.gui-scripts]
xss-audit-desktop = "xss_audit.gui:main"

[tool.setuptools]
packages = ["xss_audit"]

[tool.setuptools.package-data]
xss_audit = ["audit-playbook.md", "UPSTREAM-LICENSE.txt"]
