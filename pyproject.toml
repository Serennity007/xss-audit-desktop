[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xss-audit-desktop"
version = "0.1.0"
description = "Local XSS review assistant with desktop, CLI, and opt-in AI review"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Serennity007"}]
dependencies = []

[project.scripts]
xss-audit = "xss_audit.cli:main"

[project.gui-scripts]
xss-audit-desktop = "xss_audit.gui:main"

[tool.setuptools]
packages = ["xss_audit"]

[tool.setuptools.package-data]
xss_audit = ["audit-playbook.md", "UPSTREAM-LICENSE.txt"]
