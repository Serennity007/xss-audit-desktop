<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">XSS Audit Desktop</title>
  <desc id="desc">A source-code security review workbench with desktop and CLI entrypoints, AST evidence, local triage and portable reports. Typographic product banner, not an application screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1728"/><stop offset="1" stop-color="#102c3b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#61e4cd"/><stop offset="1" stop-color="#b5efe3"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#aec5d9" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1440" height="480" rx="22" fill="url(#bg)"/>
  <rect width="1440" height="480" rx="22" fill="url(#grid)"/>
  <path d="M0 478H1440" stroke="url(#accent)" stroke-width="4"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="64" y="49" width="36" height="36" rx="9" fill="#173c49" stroke="#61e4cd" stroke-opacity=".55"/>
    <path d="m78 59-7 8 7 8m9-16 7 8-7 8" fill="none" stroke="#8cebd9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="114" y="73" fill="#b7ccdb" font-size="15" letter-spacing="2.8">SOURCE-CODE SECURITY REVIEW</text>
    <text x="60" y="192" fill="#f4f8fc" font-size="89" font-weight="750" letter-spacing="-4">XSS AUDIT</text>
    <text x="64" y="262" fill="url(#accent)" font-size="60" font-weight="650" letter-spacing="6">DESKTOP</text>
    <text x="67" y="320" fill="#bccddc" font-size="23">AST evidence. Review decisions. Portable reports.</text>
    <g font-size="15" fill="#dcebf4">
      <rect x="66" y="365" width="153" height="37" rx="18" fill="#163b48" stroke="#355768"/><text x="86" y="389">Desktop + CLI</text>
      <rect x="232" y="365" width="173" height="37" rx="18" fill="#163b48" stroke="#355768"/><text x="253" y="389">English / Chinese</text>
      <rect x="418" y="365" width="132" height="37" rx="18" fill="#163b48" stroke="#355768"/><text x="440" y="389">Optional AI</text>
    </g>
    <rect x="856" y="61" width="520" height="356" rx="17" fill="#0a1828" stroke="#345268"/>
    <path d="M885 104H1347" stroke="#284355"/>
    <circle cx="890" cy="84" r="4" fill="#62dac4"/><circle cx="906" cy="84" r="4" fill="#8da3b8"/><circle cx="922" cy="84" r="4" fill="#8da3b8"/>
    <text x="1339" y="89" text-anchor="end" fill="#8da9bb" font-size="12" letter-spacing="2">REVIEW WORKFLOW</text>
    <g font-family="Consolas,monospace">
      <text x="890" y="149" fill="#64dfc8" font-size="14">01 / IMPORT</text><text x="890" y="181" fill="#e1ebf3" font-size="21">Local folder or public GitHub</text>
      <text x="890" y="235" fill="#64dfc8" font-size="14">02 / INSPECT + TRIAGE</text><text x="890" y="267" fill="#e1ebf3" font-size="21">Context, flow evidence, notes</text>
      <text x="890" y="321" fill="#64dfc8" font-size="14">03 / EXPORT</text><text x="890" y="353" fill="#e1ebf3" font-size="21">HTML / Markdown / JSON / SARIF</text>
    </g>
    <text x="66" y="449" fill="#86a3b6" font-size="12" letter-spacing="1.7">SERENNITY007 / MIT-LICENSED DERIVATIVE</text>
  </g>
</svg>
