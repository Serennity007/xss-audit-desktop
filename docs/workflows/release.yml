name: Build Windows Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
      - name: Smoke test packaged CLI
        run: |
          $version = python -c 'from xss_audit import __version__; print(__version__)'
          $releaseDir = "release/v$version"
          & "$releaseDir/xss-audit-cli.exe" --version
          New-Item -ItemType Directory -Path build/smoke -Force | Out-Null
          'element.innerHTML = userInput;' | Set-Content -Encoding utf8 build/smoke/example.js
          & "$releaseDir/xss-audit-cli.exe" build/smoke --format json -o build/smoke-report.json
          $report = Get-Content build/smoke-report.json -Raw | ConvertFrom-Json
          if ($report.matches.Count -lt 1) { throw 'No expected review signal found' }
      - uses: actions/upload-artifact@v4
        with:
          name: xss-audit-windows-x64
          path: release/v*/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create '${{ github.ref_name }}' --title 'XSS Audit ${{ github.ref_name }}' --notes-file docs/RELEASE.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload '${{ github.ref_name }}' ./release/v*/* --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
